name: Vigilante de laboratorios y del sistema

# Cada 2 h revisa la última señal de vida de cada pieza (scripts/vigilante.py): robot de labs (≤ 11 h: avisa antes de la
# visita si falló la corrida de las 05:00), labs guardados (≤ 26 h), imagen del RIS (≤ 10 h), descarga del Doc de
# indicaciones (≤ 2 h), censo (≤ 18 h sin ningún cambio) y tamaño de la base. Si algo se atrasó, el job termina en ROJO y
# GitHub manda el correo de "workflow failed" al dueño del repo (usa el mismo secret SUPABASE_SERVICE_KEY del scraper).
on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # keepalive (endpoint "enable workflow")

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub desactiva los cron tras 60 días sin actividad; llamar a "enable" reinicia el contador.
      - name: Keepalive del cron
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/labs-watchdog.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/winlab-scraper.yml/enable"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Todas las piezas, no solo los labs (27 oct 2026): robot de labs, labs guardados, imagen (RIS), Doc de indicaciones,
      # censo y tamaño de la base. Solo horas y conteos en la bitácora (es pública).
      - name: Vigilar el sistema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/vigilante.py
