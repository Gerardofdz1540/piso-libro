name: CI

# Pruebas en cada pull request (todas las ramas) y, vía workflow_call, antes de publicar la app
# (deploy-pages.yml llama a este archivo y solo publica si pasa). Tres jobs:
#   unidad      sintaxis de los scripts de index.html (syncheck), pruebas del Apps Script del censo,
#               lint de index.html (si hay package.json en la raíz) y las pruebas sin red del robot
#               (scraper, drilldown, parser PDF, RIS). No necesita navegador.
#   app         las suites headless de la app en Chromium (tests/headless/run_all.sh).
#   app-webkit  las suites del iPad en WebKit (el motor de Safari). Advisorio (continue-on-error)
#               hasta que pasen en WebKit: aparece en el PR pero no lo bloquea.
# Protección de main (GitHub → Settings → Branches → main → "Require status checks to pass"):
# exigir los checks "unidad" y "app", y "Require branches to be up to date before merging" (20 oct 2026: si no, dos PR
# que suben version.json al mismo valor pasan los dos; ver el paso «version.json acompaña a index.html»). Las acciones
# van fijadas por SHA de commit (ver dependabot.yml).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la corrida anterior (no hace falta terminarla).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unidad:
    name: unidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Historia completa (20 oct 2026): el paso «version.json acompaña a index.html» compara el PR con su rama base, y la
      # publicación con el commit anterior de main (git diff <base>...HEAD necesita la base y el ancestro común; con la
      # copia de un solo commit no existen y el paso fallaría en TODOS los PR).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Aviso de versión nueva (20 oct 2026): la app compara su PL_BUILD (index.html) con "v" de version.json. Si un PR
      # cambia index.html sin subir version.json, los equipos con la versión anterior nunca ven «Hay una versión nueva».
      # La igualdad de los dos valores la revisa tests/headless/version_check.js (job app).
      #   - pull_request: contra la rama base del PR.
      #   - push (la publicación: deploy-pages.yml llama a este archivo en cada push a main): contra el commit anterior
      #     de main (github.event.before). Dos PR abiertos a la vez que suben la versión al MISMO valor siguiente pasan
      #     los dos en su PR y se fusionan sin conflicto: main queda con los cambios del segundo y la "v" del primero, y
      #     los equipos que ya tenían la del primero nunca ven el aviso. Aquí falla (y Cloudflare no se publica hasta que
      #     se suba la versión otra vez). Para que no llegue a pasar: «Require branches to be up to date before merging»
      #     en la protección de main (ver MANUAL-OPERACION.md).
      - name: version.json acompaña a index.html (PR y publicación)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then base="origin/${BASE_REF}"; donde="la rama base ${BASE_REF}"
          else
            base="$ANTES"; donde="el commit anterior de main (${ANTES})"
            # Primer push de la rama o historia reescrita (force-push): no hay con qué comparar.
            if [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "::warning::Sin commit anterior con el que comparar («${base}»): se omite la revisión de version.json."; exit 0
            fi
          fi
          cambios="$(git diff --name-only "${base}...HEAD")"
          echo "Archivos que cambian respecto a ${donde}:"
          printf '%s\n' "$cambios"
          # Sin tubería (grep <<<): GitHub corre los pasos con pipefail, y un grep -q que termina antes que printf daría «no
          # cambió» por SIGPIPE con una lista larga.
          if ! grep -qx 'index.html' <<< "$cambios"; then echo "OK: index.html no cambió."; exit 0; fi
          # También cuenta el valor: un version.json tocado con la misma "v" tampoco hace salir el aviso.
          v_base="$(git show "${base}:version.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("v",""))' 2>/dev/null || true)"
          v_pr="$(python3 -c 'import json; print(json.load(open("version.json")).get("v",""))' 2>/dev/null || true)"
          echo "version.json: base «${v_base}» → ahora «${v_pr}»"
          if ! grep -qx 'version.json' <<< "$cambios" || [ -z "$v_pr" ] || [ "$v_pr" = "$v_base" ]; then
            echo "::error file=version.json::index.html cambió y version.json no: sube la versión en los dos (PL_BUILD en index.html y \"v\" en version.json, mismo valor nuevo; ver MANUAL-OPERACION.md)."
            exit 1
          fi
          echo "OK: version.json sube con index.html."

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rpa/package-lock.json

      - name: Sintaxis de los scripts de index.html
        run: node tests/headless/syncheck.js index.html

      - name: Pruebas del Apps Script (censo-sync)
        run: node apps-script/censo-sync.test.js

      - name: Pruebas del Apps Script (registro de pacientes, datos ficticios)
        run: node apps-script/registro-pacientes.test.js

      # Lint de index.html (funciones duplicadas, etc.): node tools/lint-index.js, sin dependencias.
      # Solo si existe package.json en la raíz (lo trae el PR que añade el lint).
      - name: Lint de index.html (si hay package.json raíz)
        run: |
          if [ -f package.json ]; then
            npm run lint
          else
            echo "Sin package.json en la raíz: se omite el lint."
          fi

      # Las pruebas del robot son funciones puras: no hace falta Chromium. --ignore-scripts salta el
      # postinstall de rpa (playwright install --with-deps chromium) y la variable evita la descarga
      # si algo lo invoca de todos modos. npm ci instala EXACTAMENTE lo que fija package-lock.json.
      - name: Instalar dependencias del robot (sin Chromium)
        working-directory: rpa
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pruebas sin red del robot (scraper, drilldown, parser PDF, RIS)
        working-directory: rpa
        run: npm test

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests/headless
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/headless/package-lock.json

      # Playwright fijado en tests/headless/package-lock.json (las suites hacen require('playwright')).
      - name: Instalar Playwright
        run: npm ci --no-audit --no-fund

      # La llave incluye el hash del lockfile: al subir Playwright se baja el Chromium que le toca.
      - name: Cache de navegadores Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/headless/package-lock.json') }}

      # Con el navegador ya en caché solo instala las librerías del sistema (--with-deps).
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # run_all.sh deja el log de cada suite en $TMPDIR/suite_<nombre>.log; lo apuntamos a la carpeta
      # temporal del runner para poder subirlo si algo falla.
      - name: Suites headless (Chromium)
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run all

      - name: Subir logs de las suites
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-suites-chromium
          path: ${{ runner.temp }}/suite_*.log
          if-no-files-found: warn
          retention-days: 7

  # Mismas suites del iPad (app_ipad, app_pen, app_pencil, app_offline, app_cajas) en WebKit, el
  # motor de Safari: lo que usan los iPads. Advisorio: el job se marca con aviso si falla, pero no
  # bloquea el PR ni la publicación. Quitar continue-on-error cuando pasen en WebKit.
  app-webkit:
    name: app-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: tests/headless
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/headless/package-lock.json

      - name: Instalar Playwright
        run: npm ci --no-audit --no-fund

      - name: Cache de navegadores Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('tests/headless/package-lock.json') }}

      - name: Instalar WebKit
        run: npx playwright install --with-deps webkit

      - name: Suites del iPad (WebKit)
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run webkit

      - name: Subir logs de las suites
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-suites-webkit
          path: ${{ runner.temp }}/suite_*.log
          if-no-files-found: warn
          retention-days: 7
