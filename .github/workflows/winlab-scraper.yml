name: WinLab Scraper (Visita Medica 14:00)

# WinLab publica labs a distintas horas. Corremos 3 veces al dia (León = CST,
# UTC-6, sin horario de verano). Todos los dias (incluye fines de semana por
# guardias). Si no hay labs nuevos, el upsert reescribe la misma data, no rompe.
#   05:00 León = 11:00 UTC  (labs de la madrugada / nocturnos; antes 04:07)
#   12:30 León = 18:30 UTC  (visita medica — run principal, listo antes de las 14:00; antes 13:15)
#   20:07 León = 02:07 UTC  (labs de la tarde/noche)
# Quien dispara esas 3 corridas A LA HORA EXACTA es Supabase (pg_cron → worker /api/scrape →
# workflow_dispatch; ver scripts/supabase_pg_cron_dispatch.sql). El cron de GitHub en este repo
# llega con 3–9 h de retraso, así que aquí queda UNA sola corrida diaria de RESPALDO (si Supabase
# o el worker fallan, al menos hay labs una vez al día y el vigilante avisa a las 26 h).
# Nota: GitHub retrasa (o salta) los cron que caen en el minuto :00 en horas pico porque
# todo el mundo programa ahí; por eso los minutos van desplazados.
on:
  schedule:
    - cron: "37 16 * * *"  # 10:37 León — respaldo diario (llega entre ~13:30 y ~19:30 León)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — recorre WinLab completo pero NO escribe en Supabase. Úsalo para verificar que el scraper encuentra los labs correctamente."
        required: false
        default: false
        type: boolean
      exp:
        description: "Corrida dirigida: «ID-<uuid>» del paciente (lo manda la app con «🔎 Buscar ahora»; este dato es público, por eso no va el expediente) o expediente(s) separados por coma. Solo busca a esos pacientes (2-4 min)."
        required: false
        default: ""
        type: string

# Permisos mínimos del GITHUB_TOKEN. "actions: write" lo necesitan el paso keepalive
# (endpoint "enable workflow") y actions/cache + upload-artifact con permisos explícitos.
permissions:
  contents: read
  actions: write

concurrency:
  group: winlab-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rpa

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub desactiva los workflows programados tras 60 días sin actividad en el repo
      # (ocurrió el 2026-09-05: estado "disabled_inactivity", cero corridas hasta octubre
      # y la app se quedó sin labs). Llamar al endpoint "enable" cuenta como actividad y
      # reinicia ese contador, así que lo hacemos en cada corrida. Best-effort: si falla,
      # el scraping continúa igual.
      - name: Keepalive del cron (evita disabled_inactivity)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/winlab-scraper.yml/enable"

      # Respaldo diario sin trabajo repetido (27 oct 2026): la corrida del cron de GitHub es solo RESPALDO de las tres de
      # Supabase (05:00, 12:30, 20:07). Si en las últimas 8 h el robot ya revisó al menos al 80 % del censo (winlab_match),
      # no hay nada que respaldar y termina en segundos; si no (Supabase o el worker fallaron), corre completa.
      - name: ¿Hace falta el respaldo?
        id: respaldo
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -uo pipefail
          desde="$(date -u -d '8 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          cuenta() { curl -fsS -o /dev/null -D - -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                       -H "Prefer: count=exact" -H "Range: 0-0" "$SUPABASE_URL/rest/v1/$1" | tr -d '\r' | sed -n 's#^[Cc]ontent-[Rr]ange: .*/\([0-9]*\)$#\1#p'; }
          censo="$(cuenta 'patients?select=id' || true)"; vistos="$(cuenta "winlab_match?select=exp&checked_at=gte.$desde" || true)"
          echo "Censo: ${censo:-?} · revisados por el robot desde $desde: ${vistos:-?}"
          if [ -n "${censo:-}" ] && [ -n "${vistos:-}" ] && [ "$censo" -gt 0 ] && [ $((vistos * 100)) -ge $((censo * 80)) ]; then
            echo "saltar=1" >> "$GITHUB_OUTPUT"
            echo "### WinLab Scraper (respaldo)" >> "$GITHUB_STEP_SUMMARY"
            echo "No hizo falta: en las últimas 8 h el robot ya revisó $vistos de $censo pacientes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node 22
        if: steps.respaldo.outputs.saltar != '1'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rpa/package-lock.json

      - name: Cache Playwright browsers
        if: steps.respaldo.outputs.saltar != '1'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        if: steps.respaldo.outputs.saltar != '1'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ steps.pw-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        # npm ci: instala EXACTAMENTE lo que fija package-lock.json (antes npm install resolvía
        # versiones nuevas en cada corrida: una actualización de playwright/pdf-parse podía
        # romper el scraper sin que nadie cambiara nada).
        run: npm ci --no-audit --no-fund

      # Las pruebas sin red ya corren (y bloquean) en cada pull request (ci.yml, job "unidad"), así
      # que aquí solo AVISAN: una prueba rota no debe dejar al piso sin labs. continue-on-error deja
      # el paso en rojo con su aviso, pero la corrida sigue.
      - name: Tests offline (solo aviso; bloquean en ci.yml, no aquí)
        if: steps.respaldo.outputs.saltar != '1'
        continue-on-error: true
        run: |
          if ! (node scraper.test.js && node drilldown.test.js && node pdf-extract.test.js); then
            echo "::warning title=Pruebas del robot rotas::Alguna prueba sin red falló; la corrida de labs continúa. Revisa el último PR y el job 'unidad' de ci.yml."
            exit 1
          fi

      - name: Ensure Chromium present
        if: steps.respaldo.outputs.saltar != '1' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install --with-deps chromium

      # Reintento coherente con el timeout del job (90 min): 45 min por intento (una corrida completa tarda 25-32 min),
      # así el segundo intento sí cabe (27 oct 2026: con 60 min casi nunca cabía; además el robot ya no se queda pasmado:
      # cada operación del navegador tiene tope y se reinicia solo). Antes era 85 min × 2 intentos → el segundo nunca cabía. Se reintenta
      # tanto por error como por tiempo agotado: con el flush incremental lo ya guardado no se
      # pierde y el reintento reutiliza los reportes ya parseados, así que solo gasta tiempo en lo
      # que falta.
      # Bucle propio en bash (oct 2026): antes era nick-fields/retry@v3, una acción de terceros que
      # recibía WINLAB_PASS y SUPABASE_SERVICE_KEY. Mismos 2 intentos, 45 min por intento y 30 s de
      # espera. `timeout` manda SIGTERM a todo el grupo de procesos (npm y node), así el scraper
      # alcanza a volcar lo capturado; --kill-after remata si no sale solo.
      - name: Run scraper (con reintentos)
        if: steps.respaldo.outputs.saltar != '1'
        run: |
          rc=1
          for intento in 1 2; do
            echo "::group::Intento $intento de 2 (tope 45 min)"
            set +e
            timeout --kill-after=60s 45m npm run scrape
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -eq 124 ]; then
              echo "::warning title=WinLab Scraper::Intento $intento agotó los 45 min."
            else
              echo "::warning title=WinLab Scraper::Intento $intento falló (código $rc)."
            fi
            if [ "$intento" -lt 2 ]; then sleep 30; fi
          done
          exit "$rc"
        env:
          WINLAB_URL:               ${{ secrets.WINLAB_URL }}
          WINLAB_USER:              ${{ secrets.WINLAB_USER }}
          WINLAB_PASS:              ${{ secrets.WINLAB_PASS }}
          WINLAB_RESULTS_URL:       ${{ secrets.WINLAB_RESULTS_URL }}
          WINLAB_USER_SELECTOR:     ${{ secrets.WINLAB_USER_SELECTOR }}
          WINLAB_PASS_SELECTOR:     ${{ secrets.WINLAB_PASS_SELECTOR }}
          WINLAB_SUBMIT_SELECTOR:   ${{ secrets.WINLAB_SUBMIT_SELECTOR }}
          WINLAB_TABLE_SELECTOR:    ${{ secrets.WINLAB_TABLE_SELECTOR }}
          WINLAB_LOGGED_SELECTOR:   ${{ secrets.WINLAB_LOGGED_SELECTOR }}
          WINLAB_NEXT_SELECTOR:     ${{ secrets.WINLAB_NEXT_SELECTOR }}
          # Pestaña de temporalidad: selector del tab "Por Temporalidad" (opcional).
          WL_TEMPORALIDAD_TAB_SEL:  ${{ secrets.WL_TEMPORALIDAD_TAB_SEL }}
          # Dropdown "Profilo Consultazione" (default: AYER Y HOY) — fix validado PR #116.
          WL_PROFILO_SEL:           ${{ secrets.WL_PROFILO_SEL }}
          WL_PROFILO_VALUE:         ${{ secrets.WL_PROFILO_VALUE }}
          # Días de lookback para el rango de fechas (default: 2 = HOY + AYER).
          WL_LOOKBACK_DAYS:         ${{ secrets.WL_LOOKBACK_DAYS }}
          # Drilldown: descargar hasta N PDFs por paciente. 4→16→12 (15 jun 2026):
          # WinLab guarda CADA panel como referto SEPARADO (BH, química, hepática, coags...).
          # Con 4 la QS/hepática quedaba sin drillear. 16 fue demasiado: el presupuesto
          # por-paciente (90s) no alcanzaba para 16 drills y abandonaba pacientes. 12 cubre
          # BH+QS+hepática+coags de varios días y entra en 90s. El targeting limita a los
          # reportes del OBJETIVO. Esta env OVERRIDE pisa el default del código.
          WL_DRILLDOWN_MAX:         "12"
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_TABLE:           ${{ secrets.SUPABASE_TABLE }}
          SUPABASE_ON_CONFLICT:     ${{ secrets.SUPABASE_ON_CONFLICT }}
          DRY_RUN:                  ${{ inputs.dry_run || 'false' }}
          # Corrida dirigida a uno o varios expedientes (oct 2026): vacío = censo completo.
          WL_TARGET_EXP:            ${{ inputs.exp || '' }}

      # Sin adjuntos de diagnóstico (27 oct 2026): el repositorio es público y las capturas de WinLab/RIS y los volcados
      # de la pantalla traen nombres de pacientes; cualquiera con cuenta de GitHub podía descargarlos. El diagnóstico
      # queda en la bitácora, que ya no lleva nombres (iniciales y expediente recortado, ver rpa/lib.js).
      - name: Notify failure (GitHub envia email automaticamente)
        if: failure()
        run: |
          echo "::error title=WinLab Scraper FAIL::El scraping falló tras 2 intentos. Revisa la bitácora y el resumen del job (sin capturas: el repositorio es público)."
          exit 1
