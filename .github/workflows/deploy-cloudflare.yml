name: Deploy a Cloudflare (worker pisolibro)

# Publica la app en el worker "pisolibro" de Cloudflare:
#  - automáticamente en cada push a main
#  - manualmente desde la pestaña Actions (workflow_dispatch)
#
# Requiere dos secrets en Settings → Secrets and variables → Actions:
#  - CLOUDFLARE_API_TOKEN  (token con permiso "Workers Scripts: Edit")
#  - CLOUDFLARE_ACCOUNT_ID (ID de la cuenta, visible en el dashboard de Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar assets estáticos
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js dist/
          cp -r icons dist/icons

      - name: Publicar con Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
