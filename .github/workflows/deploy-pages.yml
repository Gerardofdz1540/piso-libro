name: Deploy a Cloudflare Pages

# Auto-deploy continuo: cada push a la rama de produccion publica la app.
# Se suben index.html + _headers + assets de la PWA (manifest.json, sw.js,
# icons/). El resto del repo (rpa, scripts, docs) NO se publica.
#
# Requiere 2 secrets en GitHub (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   (token con permiso "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID  (ID de la cuenta Cloudflare)
#
# Antes de publicar corren las pruebas del MISMO commit (job "pruebas" → ci.yml: syncheck,
# Apps Script, robot y suites headless). Si algo falla no se publica y los iPads siguen con la
# versión anterior. ci.yml declara `on: workflow_call` para poder llamarse desde aquí.

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - _headers
      - manifest.json
      - sw.js
      - icons/**
      - vendor/**
      # 21 oct 2026: también se publica (aviso de versión nueva); un push que solo lo cambie debe llegar a Cloudflare.
      - version.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  # Reusable: mismos checks que en cada PR. Si falla cualquiera de los tres (unidad, app y, desde el
  # 21 oct 2026, app-webkit: las suites del iPad en el motor de Safari) no se publica.
  pruebas:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir carpeta de publicacion (app + PWA)
        run: |
          mkdir -p dist/icons dist/vendor
          cp index.html   dist/index.html
          cp _headers     dist/_headers
          cp manifest.json dist/manifest.json
          cp sw.js        dist/sw.js
          cp icons/*.png  dist/icons/
          # Librerías empaquetadas (oct 2026): la app ya no depende de CDNs externos
          cp vendor/*.js  dist/vendor/
          # Aviso de versión nueva (20 oct 2026): la app compara su PL_BUILD (index.html) con "v" de version.json;
          # los dos se suben a mano en el mismo PR (ci.yml lo exige) y aquí se publican tal cual.
          cp version.json dist/version.json
          ls -la dist dist/icons dist/vendor

      # OJO: `--branch` NO es la rama de git que se publica (siempre es `main`, ver `on:`), sino la
      # etiqueta que Cloudflare usa para decidir si el deploy es de PRODUCCIÓN o de preview: cuenta
      # como producción solo si coincide con la "Production branch" del proyecto `pisolibro`
      # (Cloudflare → pisolibro → Settings → Builds & deployments). Desde el 14-oct-2026 esa rama es
      # `main` (antes feature/winlab-auto-sync). Si alguien la cambia en Cloudflare, hay que cambiarla
      # aquí también, o los deploys quedarán como preview y producción se congelará sin aviso.
      # Fijada por SHA (v4 instala Wrangler 4 por defecto; `pages deploy` no cambió. Si hiciera falta
      # volver a Wrangler 3: `wranglerVersion: "3.90.0"` en `with`).
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pisolibro --branch=main
