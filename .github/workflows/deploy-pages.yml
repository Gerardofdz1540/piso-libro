name: Deploy a Cloudflare Pages

# Auto-deploy continuo: cada push a la rama de produccion publica la app.
# Se suben index.html + _headers + assets de la PWA (manifest.json, sw.js,
# icons/). El resto del repo (rpa, scripts, docs) NO se publica.
#
# Requiere 2 secrets en GitHub (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   (token con permiso "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID  (ID de la cuenta Cloudflare)

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - _headers
      - manifest.json
      - sw.js
      - icons/**
      - vendor/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir carpeta de publicacion (app + PWA)
        run: |
          mkdir -p dist/icons dist/vendor
          cp index.html   dist/index.html
          cp _headers     dist/_headers
          cp manifest.json dist/manifest.json
          cp sw.js        dist/sw.js
          cp icons/*.png  dist/icons/
          # Librerías empaquetadas (oct 2026): la app ya no depende de CDNs externos
          cp vendor/*.js  dist/vendor/
          ls -la dist dist/icons dist/vendor

      # OJO: `--branch` NO es la rama de git que se publica (siempre es `main`, ver `on:`), sino la
      # etiqueta que Cloudflare usa para decidir si el deploy es de PRODUCCIÓN o de preview: cuenta
      # como producción solo si coincide con la "Production branch" del proyecto `pisolibro`
      # (Cloudflare → pisolibro → Settings → Builds & deployments). Desde el 14-oct-2026 esa rama es
      # `main` (antes feature/winlab-auto-sync). Si alguien la cambia en Cloudflare, hay que cambiarla
      # aquí también, o los deploys quedarán como preview y producción se congelará sin aviso.
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pisolibro --branch=main
