name: Supabase Keepalive

# Previene que el proyecto Supabase free tier entre en pausa automática
# (se pausa después de 7 días sin tráfico).
# Se ejecuta cada 3 días a las 06:07 UTC (01:07 CST / hora México central).
# Usa el endpoint público de salud de Auth: no necesita llaves (el rol anon
# ya no tiene permisos sobre las tablas, así que el ping anterior a /rest/v1
# respondía 401 y el workflow solo producía avisos).
on:
  schedule:
    - cron: '7 6 */3 * *'
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (auth health)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vkxplmrzyqlamxpbtmes.supabase.co/auth/v1/health")
          echo "Supabase keepalive ping → HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "OK — Supabase activo"
          else
            echo "::warning::Supabase respondió $STATUS — puede estar pausado o con errores"
          fi
